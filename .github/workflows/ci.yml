name: StudentManagement .NET Web API CI

on:
  push:
    branches:
      - feature/ci-cd

  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore StudentManagement.sln

      - name: Build Application
        run: dotnet build StudentManagement.sln --configuration Release --no-restore

      - name: Publish Application
        run: dotnet publish StudentManagement/StudentManagement.csproj --configuration Release --no-build -o ./publish

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudentManagement-build
          path: ./publish
          retention-days: 5