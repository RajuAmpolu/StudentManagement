name: Bicep Validation

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/infra/**'
      - '.github/workflows/bicep-validate.yml'

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Bicep Template
        run: |
          Write-Host "Current branch:"
          git branch --show-current

          Write-Host "Checking Bicep file:"
          Get-Content .github/workflows/infra/main.bicep

          Write-Host "Checking for Production resources:"
          if (Select-String -Path .github/workflows/infra/main.bicep -Pattern 'production') {
            throw "Production resource found in Bicep template!"
          }

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep Template
        run: |
          az deployment group validate `
            --resource-group StudentManagement-staging `
            --template-file .github/workflows/infra/main.bicep

      - name: Preview Infrastructure Changes
        run: |
          az deployment group what-if `
            --resource-group StudentManagement-staging `
            --template-file .github/workflows/infra/main.bicep
